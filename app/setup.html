<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>模型连接设置 · 织物猪</title><style>body{font:16px/1.8 system-ui;background:#f5f4f6;color:#29262c;margin:0}main{max-width:660px;margin:50px auto;padding:32px;background:white;border-radius:16px}label{display:block;margin:22px 0 8px}input,select{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:8px;font:inherit}button,a{display:inline-block;padding:12px 20px;margin-top:24px;border:0;border-radius:8px;background:#993b59;color:white;text-decoration:none;font:inherit;cursor:pointer}small{color:#777}#status{white-space:pre-wrap}a{background:#eee;color:#333}@media(max-width:700px){main{margin:15px;padding:20px}}</style><main><h1>模型连接设置</h1><p>密钥只保存到本机服务端，用于调用所选服务。不会保存在网页或浏览器存储里。</p><form id="form"><label for="provider">模型服务</label><select id="provider"><option value="ark">豆包 / 火山方舟</option><option value="openai">OpenAI</option></select><label for="key">API Key</label><input id="key" type="password" autocomplete="off" placeholder="粘贴所选服务的 API Key；已保存时留空"><label for="understand">需求理解模型 ID</label><input id="understand" value="doubao-seed-2-1-pro-260915"><label for="image">图片生成模型 ID</label><input id="image" value="doubao-seedream-5-0-pro-260628"><button id="save">保存连接设置</button></form><p id="status" role="status">正在读取连接状态…</p><small>保存设置不会调用付费模型。返回工作台点击生成后，素材及要求会发送到所选模型服务并按实际调用计费。</small><br><a href="/">← 返回工作台</a></main><script>
const status=document.querySelector('#status');let providers=[];
function showProvider(){const c=providers.find(c=>c.providerId===document.querySelector('#provider').value);if(!c)return;document.querySelector('#key').value='';document.querySelector('#understand').value=c.understandModel;document.querySelector('#image').value=c.imageModel;status.textContent=c.keyPresent?'已配置此服务密钥。真实连接以生成结果为准。':'此服务尚未配置密钥。';}
document.querySelector('#provider').onchange=showProvider;
async function config(){const r=await fetch('/api/config');const c=await r.json();providers=c.providers;document.querySelector('#provider').value=c.providerId;showProvider();}
config().catch(()=>status.textContent='本地服务未连接。请通过启动工作台.command 打开。');
document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const button=document.querySelector('#save');button.disabled=true;try{const key=document.querySelector('#key');const payload={providerId:document.querySelector('#provider').value,understandModel:document.querySelector('#understand').value.trim(),imageModel:document.querySelector('#image').value.trim()};if(key.value.trim())payload.apiKey=key.value.trim();const r=await fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json','X-Workbench':'1'},body:JSON.stringify(payload)});const result=await r.json();if(!r.ok)throw new Error(result.error);providers=result.providers;key.value='';status.textContent='连接设置已保存。可以返回工作台生成图片。';}catch(error){status.textContent=error.message;}finally{button.disabled=false;}};
</script></html>
